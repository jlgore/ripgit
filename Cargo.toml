[package]
name = "ripgit"
version = "0.1.0"
edition = "2021"
authors = ["Steve James <sjames@cloudflare.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { git = "https://github.com/jlgore/workers-rs", rev = "afed3da", features = ["d1"] }
worker-macros = { git = "https://github.com/jlgore/workers-rs", rev = "afed3da" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
xpatch = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha1_smol = "1"
similar = "2"
pulldown-cmark = "0.12"
