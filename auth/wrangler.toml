name = "ripgit-auth"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# KV namespace for OAuth token storage (workers-oauth-provider uses this)
# After creating, fill in the IDs below:
#   wrangler kv namespace create OAUTH_KV
#   wrangler kv namespace create OAUTH_KV --preview
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "a643f207be5045f49fb9316b227456f5"

# Service binding to the ripgit worker.
# The service name must match `name` in ripgit's wrangler.toml.
[[services]]
binding = "RIPGIT"
service = "ripgit"

[vars]
# GitHub OAuth App client ID.
# Create an app at https://github.com/settings/applications/new
#   Homepage URL:            https://your-worker.workers.dev
#   Authorization callback:  https://your-worker.workers.dev/oauth/callback
#   (local dev callback:     http://localhost:8787/oauth/callback)
GITHUB_CLIENT_ID = "Ov23lizgetI6GvNY2McM"

# GitHub OAuth App client secret — set as a secret, not a var:
#   wrangler secret put GITHUB_CLIENT_SECRET

# Random secret for signing session cookies (any 32+ char string):
#   wrangler secret put SESSION_SECRET

# Audience that GitHub Actions OIDC tokens must carry when exchanging for a
# mirror token. Pin this to THIS deployment's URL. GitHub's default audience is
# the repo owner's URL, which every service that owner runs shares — a token
# minted for one of them would otherwise be replayable here.
OIDC_AUDIENCE = "https://ripgit-auth.sharted.workers.dev"
