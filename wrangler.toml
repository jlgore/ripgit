name = "ripgit"
main = "build/index.js"
compatibility_date = "2026-03-18"
workers_dev = false

# Repo registry — tracks which repos exist per owner so the profile page
# can list them. Populated on first successful push.
# Create with: wrangler kv namespace create REGISTRY
# Shared with the auth worker (bound there as AUTH_DB): better-auth's users,
# orgs, and teams, plus ripgit's namespaces and repo grants. Read on every
# repo request to resolve the caller's role (src/authz.rs). Migrations live in
# auth/migrations and are applied from the auth worker.
[[d1_databases]]
binding = "DIRECTORY"
database_name = "ripgit-directory"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "REGISTRY"
id = "b80650158bf14ea6852df7a0302f6e10"
[build]
command = "cargo install -q --git https://github.com/jlgore/workers-rs --rev 14cc828 worker-build && worker-build --release"

[durable_objects]
bindings = [
  { name = "REPOSITORY", class_name = "Repository" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Repository"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[limits]
cpu_ms = 300_000

# Cloudflare Artifacts — Git-compatible versioned storage. When a repo is
# linked to an Artifacts remote, ripgit mirrors its objects into the DO and
# serves the UI over them. Optional: repos can also be linked to an existing
# remote by URL + token without this binding.
[[artifacts]]
binding = "ARTIFACTS"
namespace = "ripgit"

# Scheduled sweep that pulls enrolled repos from GitHub. This is the backstop
# for the GitHub Actions push mirror: that path is keyless and fires on every
# push, but it stops when Actions does, which is one of the outages this mirror
# exists to survive. The two share no failure mode.
[[workflows]]
name = "ripgit-mirror"
binding = "MIRROR_WORKFLOW"
class_name = "MirrorWorkflow"

# Pull sweep cadence. Frequent enough that a missed push mirror is caught long
# before anyone needs the mirror, cheap enough to ignore: one info/refs call per
# enrolled repo per tick.
# Disabled until at least one repo is enrolled for pull mirroring. Re-enable by
# uncommenting once `POST /:owner/:repo/mirror/link` has been used.
# [triggers]
# crons = ["*/15 * * * *"]
